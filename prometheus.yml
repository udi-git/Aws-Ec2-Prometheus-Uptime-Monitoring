global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ec2-auto-discovery'
    ec2_sd_configs:
      - region: 'us-east-1'
        port: 9100
        filters:
          - name: tag:Monitoring
            values: ['true']
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
